<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <div class="container">
        <header class="header">
            <h1>Task List</h1>
            <button class="btn" id="theme-toggle" aria-label="Alternar tema">Light</button>
        </header>

        <main>
            <p id="msg">Current Tasks:</p>
            <ul class="task-list">
                <li class="task-item">Add Visual Styles</li>
                <li class="task-item">Add Light and Dark themes</li>
                <li class="task-item">Enable switching the theme</li>
            </ul>
        </main>
    </div>

    <noscript>
        <p>JavaScript está desativado no seu navegador. Ative-o para alternar o tema.</p>
    </noscript>

    <script src="app.js"></script>
</body>
</html>
